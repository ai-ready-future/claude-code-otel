receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Add resource attributes for better analysis
  resource:
    attributes:
      - key: environment
        value: "production"
        action: upsert

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    # One-shot counters (session.count, lines_of_code, commit/PR, code_edit_decision)
    # increment once and never update; the default ~5m expiration drops them from
    # /metrics, breaking "Active Sessions" and similar panels. Hold series for 24h.
    metric_expiration: 24h
    # Without this, the exporter maps service.name -> job and
    # service.instance.id -> instance, then DROPS every other resource
    # attribute. host.name, host.arch, os.type, os.version and service.version
    # then never reach Prometheus, and no target_info series exists to join
    # against either. Logs keep the attributes (they flow through otlphttp
    # untouched), which makes the loss hard to see: the same fleet looks
    # labelled in Loki and unlabelled in Prometheus.
    # The "Session Detail" panels (Sessions table, Total Tokens by Host) need
    # these labels; without this setting they collapse to one blank series.
    # Cardinality stays bounded — the resource set is a handful of
    # low-cardinality attributes. Session and user identifiers are metric
    # attributes, not resource attributes, so they are unaffected.
    resource_to_telemetry_conversion:
      enabled: true

  debug:
    verbosity: normal

  otlphttp:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    metrics: 
      receivers: [otlp]
      processors: [resource]
      exporters: [prometheus, debug]
    
    logs:    
      receivers: [otlp]
      processors: [resource]
      exporters: [debug, otlphttp] 
