receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Add resource attributes for better analysis
  resource:
    attributes:
      - key: environment
        value: "production"
        action: upsert

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    # One-shot counters (session.count, lines_of_code, commit/PR, code_edit_decision)
    # increment once and never update; the default ~5m expiration drops them from
    # /metrics, breaking "Active Sessions" and similar panels. Hold series for 24h.
    metric_expiration: 24h

  debug:
    verbosity: normal

  otlphttp:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    metrics: 
      receivers: [otlp]
      processors: [resource]
      exporters: [prometheus, debug]
    
    logs:    
      receivers: [otlp]
      processors: [resource]
      exporters: [debug, otlphttp] 
