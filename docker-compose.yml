networks:
  otel-network:
    driver: bridge

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest   # ≈ 50 MB
    container_name: otel-collector
    command: ["--config=/etc/otel/collector-config.yaml"]
    volumes:
      - ./collector-config.yaml:/etc/otel/collector-config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"      # OTLP gRPC in
      - "127.0.0.1:4318:4318"      # OTLP HTTP  in
      - "127.0.0.1:8889:8889"      # Prometheus scrape out
    restart: unless-stopped
    networks:
      - otel-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --storage.tsdb.retention.time=400d
      - --storage.tsdb.retention.size=20GB
      - --storage.tsdb.path=/prometheus
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./recording-rules.yml:/etc/prometheus/recording-rules.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    depends_on: [otel-collector]
    networks:
      - otel-network

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
    restart: unless-stopped
    networks:
      - otel-network

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=logsSampleInExplore
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./claude-code-dashboard.json:/var/lib/grafana/dashboards/claude-code-dashboard.json:ro
      - ./dev-productivity-dashboard.json:/var/lib/grafana/dashboards/dev-productivity-dashboard.json:ro
      - ./exec-roi-dashboard.json:/var/lib/grafana/dashboards/exec-roi-dashboard.json:ro
      - ./claude-code-codeburn.json:/var/lib/grafana/dashboards/claude-code-codeburn.json:ro
      - ./claude-code-context-analytics.json:/var/lib/grafana/dashboards/claude-code-context-analytics.json:ro
    ports:
      - "127.0.0.1:3333:3000"
    restart: unless-stopped
    depends_on: [prometheus, loki]
    networks:
      - otel-network 
